server:
  port: 8081

spring:
  application:
    name: service-order
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-order}:5432/${DB_NAME:orderdb}
    username: ${DB_USER:order_user}
    password: ${DB_PASS:order_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2.0
          max-attempts: 3
        default-requeue-rejected: false

saga:
  queues:
    payment-request: payment.request
    payment-response: payment.response
    order-events: order.events

loki:
  url: ${LOKI_URL:http://loki:3100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_ENDPOINT:http://tempo:4317}
app:
  jwt:
    secret: shopflow-super-secret-key-change-in-production-must-be-256-bits-long

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}