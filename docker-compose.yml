#version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  ShopFlow — Full Stack
#  Includes: Databases, RabbitMQ, Services, Grafana observability stack
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Databases ───────────────────────────────────────────────────────────────

  postgres-order:
    image: postgres:15-alpine
    container_name: shopflow-postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./docker/postgres-order/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order_user -d orderdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:15-alpine
    container_name: shopflow-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
      - ./docker/postgres-payment/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment_user -d paymentdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Message Broker ───────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:4.3.1-management
    container_name: shopflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Microservices ────────────────────────────────────────────────────────────

  service-order:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: shopflow-order
    restart: on-failure
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres-order
      DB_NAME: orderdb
      DB_USER: order_user
      DB_PASS: order_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      LOKI_URL: http://loki:3100
      OTEL_ENDPOINT: http://tempo:4317
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  service-payment:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: shopflow-payment
    restart: on-failure
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: postgres-payment
      DB_NAME: paymentdb
      DB_USER: payment_user
      DB_PASS: payment_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      PAYMENT_FAIL_THRESHOLD: "500.00"
      PAYMENT_MAX_AMOUNT: "10000.00"
      LOKI_URL: http://loki:3100
      OTEL_ENDPOINT: http://tempo:4317
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: shopflow-gateway
    restart: on-failure
    depends_on:
      service-order:
        condition: service_healthy
      service-payment:
        condition: service_healthy
    environment:
      LOKI_URL: http://loki:3100
      OTEL_ENDPOINT: http://tempo:4317
    ports:
      - "8086:8086"

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    image: nginx:alpine
    container_name: shopflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend-service:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway

  # ── Observability Stack ───────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: shopflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  loki:
    image: grafana/loki:2.9.0
    container_name: shopflow-loki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:latest
    container_name: shopflow-tempo
    user: "0:0"
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: shopflow-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: shopflow
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_order_data:
  postgres_payment_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
